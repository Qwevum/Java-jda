plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'Qwevum'
version = '2.0.0'

repositories {
    mavenCentral()
}

// Compiled for Java 21 so the bot runs on hosts that only offer Java 21.
// Voice (music) additionally needs Java 25 at runtime, see DaveSupport.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'Qwevum.television.Television'
}

def jdaveVersion = '0.1.8'

// JDAVE is published for Java 25 only. The code is compiled for 21, so let the runtime
// classpath (and the shaded jar) accept Java 25 libraries.
configurations.matching { it.name in ['runtimeClasspath', 'testRuntimeClasspath'] }.configureEach {
    attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25) }
}

dependencies {
    implementation('net.dv8tion:JDA:6.7.0') {
        // LavaPlayer already produces Opus audio, so JDA's Opus encoder is not needed
        exclude module: 'opus-java'
    }

    // Discord voice end-to-end encryption (DAVE). Only loaded on Java 25+, see DaveSupport.
    runtimeOnly "club.minnced:jdave-api:$jdaveVersion"
    runtimeOnly "club.minnced:jdave-native-linux-x86-64:$jdaveVersion"
    runtimeOnly "club.minnced:jdave-native-linux-aarch64:$jdaveVersion"
    runtimeOnly "club.minnced:jdave-native-win-x86-64:$jdaveVersion"
    runtimeOnly "club.minnced:jdave-native-darwin:$jdaveVersion"

    implementation 'dev.arbjerg:lavaplayer:2.2.7'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
    implementation 'ch.qos.logback:logback-classic:1.6.5'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes(
                'Main-Class': 'Qwevum.television.Television',
                // Lets JDAVE call its native library on Java 25 without warnings
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

tasks.named('shadowJar') {
    // Fixed name so the hosting panel's startup jar never needs changing
    archiveFileName = 'Television.jar'
    mergeServiceFiles()
}
