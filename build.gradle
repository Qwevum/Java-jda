plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'Qwevum'
version = '2.0.0'

repositories {
    mavenCentral()
    // youtube-source (LavaPlayer's own YouTube support no longer works) and LavaSrc (Spotify, Apple Music)
    maven { url = 'https://maven.lavalink.dev/releases' }
    maven { url = 'https://maven.topi.wtf/releases' }
    // youtube-source snapshots, for YouTube fixes that aren't in a release yet
    maven { url = 'https://maven.lavalink.dev/snapshots' }
}

// Java 25 everywhere: JDAVE (Discord's required voice encryption) only supports Java 25
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'Qwevum.television.Television'
}

def jdaveVersion = '0.1.8'

dependencies {
    implementation('net.dv8tion:JDA:6.7.0') {
        // LavaPlayer already produces Opus audio, so JDA's Opus encoder is not needed
        exclude module: 'opus-java'
    }

    // Discord voice end-to-end encryption (DAVE), required for voice since March 2026
    implementation "club.minnced:jdave-api:$jdaveVersion"
    runtimeOnly "club.minnced:jdave-native-linux-x86-64:$jdaveVersion"
    runtimeOnly "club.minnced:jdave-native-linux-aarch64:$jdaveVersion"
    runtimeOnly "club.minnced:jdave-native-win-x86-64:$jdaveVersion"
    runtimeOnly "club.minnced:jdave-native-darwin:$jdaveVersion"

    implementation 'dev.arbjerg:lavaplayer:2.2.7'
    // Pinned to a commit after 1.18.2: YouTube broke the TV client (used when signed in) and the
    // Android client in August 2026, and the fixes aren't released yet. Switch back to a release once there is one.
    implementation 'dev.lavalink.youtube:v2:2be8e542d3f6f178e048dca565892684c2e40177-SNAPSHOT'
    implementation 'com.github.topi314.lavasrc:lavasrc:4.8.3'
    // LavaSrc compiles against an older Jackson than JDA runs with. Pin one version everywhere, or editors
    // that merge the compile and runtime classpaths (VS Code) load the old one and JDA crashes on startup.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.2')
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
    implementation 'ch.qos.logback:logback-classic:1.6.5'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes(
                'Main-Class': 'Qwevum.television.Television',
                // Lets JDAVE call its native library on Java 25 without warnings
                'Enable-Native-Access': 'ALL-UNNAMED'
        )
    }
}

tasks.named('shadowJar') {
    // Fixed name so the hosting panel's startup jar never needs changing
    archiveFileName = 'Television.jar'
    mergeServiceFiles()
}
